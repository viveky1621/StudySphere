name: studysphere_ai
description: "StudySphere - The Ultimate Educational Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  dio: ^5.4.0
  flutter_svg: ^2.0.9
  json_annotation: ^4.8.1
  flutter_animate: ^4.5.0
  google_sign_in: ^7.2.0
  file_picker: ^8.0.0
  syncfusion_flutter_pdfviewer: ^33.2.8
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/app_logo.jpg"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_logo.jpg
